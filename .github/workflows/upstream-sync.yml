name: upstream-sync

# The Windows 7 support here is an add-on layer, not a fork of pi's source: the shipped
# package installs pi from the npm pin in scripts/win7/build-package.sh. This job keeps
# `git merge upstream/main` cheap and adopts a newer npm release of pi: it bumps that pin,
# verifies the package against it, lands the result on main, and lets the tagged release
# build from that same commit.
#
# A pi-tui change does not stop any of it, but the summary says so: only the target machine
# can judge the console, so look at the release and pull it back if the shims misbehave. Two
# things still stop short, because a runner cannot decide them: a merge that conflicts, and a
# merge that touches workflow files when no credential here may push those.
on:
  schedule:
    # Mondays 03:00 UTC, 11:00 in CST, so a failed sync is waiting at the start of the week.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # for dispatching win7-package.yml: a tag pushed with this token starts no run
      actions: write
    env:
      BRANCH: upstream-sync
    steps:
      # Unlike every other workflow here, this one pushes, so it keeps the token in the
      # remote instead of persist-credentials: false. SYNC_TOKEN is an owner PAT with the
      # Workflows permission, because a run token is refused any push that edits a workflow
      # file and upstream edits its own every week. Without the secret the push falls back to
      # the run token, and the guard further down still hands those merges to a human.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: How far behind is main?
        id: drift
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/earendil-works/pi.git
          git fetch --no-tags upstream main
          behind=$(git rev-list --count "HEAD..upstream/main")
          echo "behind=$behind" >>"$GITHUB_OUTPUT"
          echo "upstream/main is $behind commits ahead of main"

      # The release that matters is the npm one, not a commit: that is what the package
      # installs. Committing the bump here, before the branch is cut, is what makes the
      # build and import checks below run against the version users would get.
      - name: Adopt a newer pi release, if npm has one
        id: pin
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^PI_VERSION="\(.*\)"$/\1/p' scripts/win7/build-package.sh)"
          latest="$(npm view @earendil-works/pi-coding-agent dist-tags.latest 2>/dev/null || true)"
          adopted=0
          tui_body=1
          if [[ -n "$latest" && "$latest" != "$pinned" ]] \
             && [[ "$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -1)" == "$latest" ]]; then
            adopted=1
            sed -i "s/^PI_VERSION=\".*\"$/PI_VERSION=\"$latest\"/" scripts/win7/build-package.sh
            echo "adopting pi $latest, replacing $pinned"
            npm view "@earendil-works/pi-coding-agent@$latest" engines --json
            echo "newest pi-tui changelog section:"
            tui_section="$(awk '/^## \[/{n++} n==1' packages/tui/CHANGELOG.md)"
            printf '%s\n' "$tui_section" | head -12
            tui_body="$(printf '%s\n' "$tui_section" | tail -n +2 | grep -cv '^[[:space:]]*$' || true)"
            echo "body lines: $tui_body (0 means the console shims still describe the TUI)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/win7/build-package.sh
            git commit -m "build: move the Windows 7 package to pi $latest"
            echo "changed=1" >>"$GITHUB_OUTPUT"
            echo "version=$latest" >>"$GITHUB_OUTPUT"
          else
            echo "pin is $pinned, npm latest is ${latest:-unreachable}: nothing to adopt"
            echo "changed=0" >>"$GITHUB_OUTPUT"
            tui_body=0
          fi
          # Reported, not enforced: the checks below are the gate, and waiting for a look at
          # a console on the target machine here left the sync's merges sitting on a branch
          # for weeks. The summary names the pi-tui case instead.
          echo "tui=$tui_body" >>"$GITHUB_OUTPUT"
          # A pin bump is worth a branch even when upstream's source has not moved.
          if [[ "${{ steps.drift.outputs.behind }}" != "0" || "$adopted" == "1" ]]; then
            echo "work=1" >>"$GITHUB_OUTPUT"
          else
            echo "work=0" >>"$GITHUB_OUTPUT"
          fi

      - name: Install 7-Zip
        if: steps.pin.outputs.work == '1'
        run: sudo apt-get update -qq && sudo apt-get install -y p7zip-full

      - name: Merge upstream into the sync branch
        if: steps.pin.outputs.work == '1'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          if ! git merge --no-edit upstream/main; then
            echo "::error::upstream/main does not merge cleanly. These files conflict:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

      # Knowing the package still works is the point of the sync, and the import baseline is
      # the only automated answer to "will this run on Windows 7". This runs here rather than
      # as a PR check because a pull request opened with GITHUB_TOKEN triggers no workflows.
      - name: Verify the package on the merged tree
        if: steps.pin.outputs.work == '1'
        run: |
          set -euo pipefail
          ./scripts/win7/build-package.sh
          ./scripts/win7/check-imports.sh .artifacts/pi-win7-x64
          node scripts/win7/check-shims.mjs .artifacts/pi-win7-x64

      - name: Land and publish, or explain what needs a human
        if: steps.pin.outputs.work == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          # No token a workflow run is given may push a workflow file -- there is no
          # `workflows` key in a permissions block, by design -- and upstream edits its own
          # workflows regularly. Name that case instead of failing on the raw rejection,
          # unless SYNC_TOKEN (an owner PAT with that grant) is doing the push.
          workflow_files="$(git diff --name-only main...HEAD -- .github/workflows/)"
          if [[ -n "$workflow_files" && -z "$SYNC_TOKEN" ]]; then
            echo "::warning::this merge changes $workflow_files, which a run token cannot push"
            echo "::notice::land it with: git fetch upstream main && git merge upstream/main && git push origin main"
            {
              echo "### upstream/main is ${{ steps.drift.outputs.behind }} commits ahead"
              echo
              echo "Verified in this runner as usual, but this merge cannot be pushed by this"
              echo "job: it changes workflow files, and GitHub refuses a push that edits one"
              echo "unless the pushing credential carries that grant, which a run token can"
              echo "never have."
              echo
              echo '```'
              echo "$workflow_files"
              echo '```'
              echo
              echo "Land it by hand -- the same command this job would have run:"
              echo
              echo '```'
              echo "git fetch upstream main && git merge upstream/main && git push origin main"
              echo '```'
              echo
              echo "The alternative is a credential that may push workflow files (a PAT with"
              echo "the \`workflow\` scope, or an App token with the Workflows permission)."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          git checkout main
          git merge --ff-only "$BRANCH"
          git push origin main
          published=0
          if [[ "${{ steps.pin.outputs.changed }}" == "1" ]]; then
            tag="win7-v${{ steps.pin.outputs.version }}-1"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::warning::$tag already exists, so this run only landed the bump on main"
            else
              git tag "$tag"
              git push origin "$tag"
              # A tag pushed with this token starts no workflow run (only workflow_dispatch
              # and repository_dispatch do), so ask win7-package.yml for the release.
              gh workflow run win7-package.yml --ref "$tag"
              published=1
            fi
          fi

          {
            echo "### upstream/main is on main"
            echo
            echo "It was ${{ steps.drift.outputs.behind }} commits ahead. The merge, the package"
            echo "build, the import baseline (what says Windows 7 can still load every import)"
            echo "and the shim checks all ran in this job, and main is at"
            echo "$(git rev-parse --short HEAD)."
            echo
            if [[ "${{ steps.pin.outputs.changed }}" == "1" ]]; then
              echo "The packaged pi moved to **${{ steps.pin.outputs.version }}**."
              echo
            fi
            if [[ "${{ steps.pin.outputs.tui }}" != "0" ]]; then
              echo "**The pi-tui changelog section has content.** The shim checks above pass,"
              echo "but only the target machine can judge the console, and the colour, border"
              echo "and width shims exist for exactly that: give the release a look on Windows 7"
              echo "and pull it back with \`gh release delete\` if it misbehaves."
              echo
            fi
            if [[ "$published" == "1" ]]; then
              echo "\`$tag\` is pushed and win7-package.yml was dispatched on it, so the"
              echo "release is built from that same commit:"
              echo "<https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag>"
            else
              echo "Nothing users download changes: PI_VERSION in"
              echo "\`scripts/win7/build-package.sh\` is already the npm release."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
